<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时会议翻译 · Live Meeting Translator</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-soft: #10141d;
    --panel: #141926;
    --panel-2: #1a2130;
    --line: #232b3c;
    --text: #e8ebf2;
    --muted: #8d95ab;
    --accent: #4f8cff;
    --accent-soft: rgba(79, 140, 255, 0.14);
    --green: #2dd4a7;
    --red: #f0505c;
    --amber: #f5b445;
    --seg-size: 20px;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, rgba(79,140,255,0.10), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(45,212,167,0.07), transparent 55%),
                var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ===== 顶栏 ===== */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(16, 20, 29, 0.75);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px rgba(45,212,167,0.8);
  }
  .brand .sub { font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: 0.06em; }
  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 22px; font-weight: 600; letter-spacing: 0.08em;
    color: var(--text); margin-left: 8px;
  }
  .top-controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  select, .btn, button {
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; cursor: pointer;
    transition: background .15s, border-color .15s, transform .05s;
  }
  button:hover, select:hover { background: #212a3d; border-color: #2c3750; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .icon-btn { padding: 8px 11px; font-size: 15px; }

  /* ===== 主区 ===== */
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 16px 22px 0; }
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    padding-bottom: 12px; flex-shrink: 0; flex-wrap: wrap;
  }
  .segmented { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .segmented button {
    border: none; border-radius: 0; background: transparent; padding: 8px 16px;
    color: var(--muted); font-size: 13px;
  }
  .segmented button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .font-ctrl { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .font-ctrl span { color: var(--muted); font-size: 13px; margin-right: 2px; }

  .panels { flex: 1; display: flex; gap: 16px; min-height: 0; padding-bottom: 12px; }
  .panel {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden;
  }
  .panel h2 {
    font-size: 13px; font-weight: 600; letter-spacing: 0.05em;
    color: var(--muted); padding: 13px 18px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .panel h2 .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 20px;
    background: var(--accent-soft); color: var(--accent); font-weight: 500;
  }
  .panel h2 .badge.zh { background: rgba(45,212,167,0.13); color: var(--green); }
  .segments { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
  .segments::-webkit-scrollbar { width: 8px; }
  .segments::-webkit-scrollbar-thumb { background: #2a344a; border-radius: 8px; }

  .seg { animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .seg-ts {
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    margin-bottom: 4px; letter-spacing: 0.05em;
  }
  .seg-text { font-size: var(--seg-size); line-height: 1.65; word-break: break-word; }
  .seg-text .cursor::after {
    content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .seg.live .seg-text { color: var(--muted); font-style: italic; }
  .seg .err { color: var(--red); font-size: 13px; }
  .panel.zh-panel .seg-text { color: var(--text); }

  .empty {
    margin: auto; text-align: center; color: var(--muted);
    font-size: 15px; line-height: 2.1; user-select: none;
  }
  .empty .big { font-size: 40px; display: block; margin-bottom: 8px; opacity: .5; }

  /* ===== 底部控制 ===== */
  .controls {
    flex-shrink: 0; border-top: 1px solid var(--line);
    background: rgba(16, 20, 29, 0.8); backdrop-filter: blur(10px);
    padding: 14px 22px; display: flex; flex-direction: column; gap: 12px;
  }
  .control-row { display: flex; align-items: center; gap: 14px; }
  .mic-wrap { display: flex; align-items: center; gap: 14px; }
  .mic-btn {
    width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(145deg, var(--accent), #3b6fe0);
    color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 22px rgba(79,140,255,0.35);
    transition: background .2s, box-shadow .2s, transform .1s;
    position: relative; flex-shrink: 0;
  }
  .mic-btn:hover { transform: scale(1.04); }
  .mic-btn.recording {
    background: linear-gradient(145deg, var(--red), #c73844);
    box-shadow: 0 6px 22px rgba(240,80,92,0.4);
  }
  .mic-btn.recording::before {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid rgba(240,80,92,0.55); animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
  .status { display: flex; flex-direction: column; gap: 3px; }
  .status .state { font-size: 15px; font-weight: 600; }
  .status .hint { font-size: 12.5px; color: var(--muted); }
  .status .state.rec { color: var(--red); }
  .status .state.ok { color: var(--green); }
  .status .state.warn { color: var(--amber); }
  .status .state.err { color: var(--red); }

  .control-actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-accent:hover { background: #3b78ef; border-color: #3b78ef; }

  .manual { display: none; gap: 10px; }
  .manual.open { display: flex; }
  .manual textarea {
    flex: 1; resize: none; height: 58px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); font-family: inherit; font-size: 15px; padding: 10px 14px;
    outline: none;
  }
  .manual textarea:focus { border-color: var(--accent); }

  .page-footer {
    flex-shrink: 0; text-align: center; padding: 9px;
    font-size: 12px; color: var(--muted); letter-spacing: 0.04em;
    border-top: 1px solid var(--line);
  }

  /* ===== 设置弹窗 ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(5, 8, 13, 0.66);
    display: none; align-items: center; justify-content: center; z-index: 50;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; }
  .modal {
    width: min(560px, calc(100vw - 40px)); max-height: 86vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 26px 28px;
  }
  .modal h3 { font-size: 18px; margin-bottom: 4px; }
  .modal .desc { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; line-height: 1.7; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 14px;
    padding: 10px 13px; outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 64px; line-height: 1.6; }
  .check { display: flex; align-items: center; gap: 9px; font-size: 14px; cursor: pointer; margin-bottom: 10px; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .spacer { flex: 1; }
  .local-model .row { display: flex; align-items: center; gap: 10px; }
  .local-model .local-status { font-size: 13px; opacity: .75; }
  .test-result { font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .test-result.ok { color: var(--green); }
  .test-result.err { color: var(--red); }

  @media (max-width: 860px) {
    .panels { flex-direction: column; overflow-y: auto; }
    .panel { min-height: 240px; }
    .brand .sub { display: none; }
    .timer { font-size: 17px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    实时会议翻译
    <span class="sub">LIVE MEETING TRANSLATOR</span>
  </div>
  <div class="timer" id="timer">00:00:00</div>
  <div class="top-controls">
    <select id="srcLang" title="发言语言" aria-label="源语言">
      <option value="auto">自动识别（俄 / 英）</option>
      <option value="ru">俄语 · Русский</option>
      <option value="en">英语 · English</option>
    </select>
    <button class="icon-btn" id="btnSettings" title="设置">⚙ 设置</button>
    <button class="icon-btn" id="btnFullscreen" title="全屏">⛶</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="segmented" id="modeSeg">
      <button data-mode="dual" class="active">双栏</button>
      <button data-mode="mixed">单栏</button>
      <button data-mode="orig">仅原文</button>
      <button data-mode="zh">仅译文</button>
    </div>
    <div class="font-ctrl">
      <span>字号</span>
      <button class="icon-btn" id="fontMinus">A−</button>
      <button class="icon-btn" id="fontPlus">A+</button>
    </div>
  </div>

  <div class="panels" id="panels">
    <section class="panel" id="panelOriginal">
      <h2>原文 <span class="badge" id="langBadge">原声</span></h2>
      <div class="segments" id="originalList">
        <div class="empty" id="emptyOriginal">
          <span class="big">🎙</span>
          点击下方麦克风开始收音<br>
          发言将实时显示在这里
        </div>
      </div>
    </section>
    <section class="panel zh-panel" id="panelZh">
      <h2>中文译文 <span class="badge zh">翻译</span></h2>
      <div class="segments" id="zhList">
        <div class="empty" id="emptyZh">
          <span class="big">文</span>
          译文实时呈现<br>
          俄语 / 英语 → 简体中文
        </div>
      </div>
    </section>
    <section class="panel" id="panelMixed" style="display:none">
      <h2>原文 / 译文 <span class="badge zh">对照</span></h2>
      <div class="segments" id="mixedList"></div>
    </section>
  </div>
</main>

<div class="controls">
  <div class="manual" id="manualBox">
    <textarea id="manualInput" placeholder="手动输入发言内容（俄语 / 英语），回车或点「翻译」…"></textarea>
    <button class="btn-accent" id="manualTranslate">翻译</button>
  </div>
  <div class="control-row">
    <div class="mic-wrap">
      <button class="mic-btn" id="micBtn" title="开始 / 停止">🎙</button>
      <div class="status">
        <div class="state" id="stateText">就绪</div>
        <div class="hint" id="stateHint">选择语言后点击麦克风开始</div>
      </div>
    </div>
    <div class="control-actions">
      <button id="btnManual">⌨ 手动输入</button>
      <button id="btnCopy">复制全文</button>
      <button id="btnExport">导出纪要</button>
      <button id="btnClear">清空</button>
    </div>
  </div>
</div>

<div class="page-footer">©lan, cooperated with artificial intelligence</div>

<!-- 设置 -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>设置</h3>
    <div class="desc">
      翻译走免费公开接口，不消耗任何 token，无需付费。
      优先使用浏览器内置翻译（如有），其次 MyMemory 免费接口。
    </div>
    <div class="field">
      <label>MyMemory 免费 Key（可选 — 在 mymemory.translated.net 免费注册，每日额度从 5,000 词升到 50,000 词）</label>
      <input type="text" id="setKey" placeholder="留空即用匿名额度">
    </div>
    <div class="field">
      <label>术语表（可选 — 译后字面替换，逐行填写）</label>
      <textarea id="setGlossary" placeholder="例如：&#10;МГУ-ППИ = 深圳北理莫斯科大学&#10;SMBU = 深圳北理莫斯科大学"></textarea>
    </div>
    <label class="check"><input type="checkbox" id="setTts"> 语音播报译文（中文朗读）</label>
    <label class="check"><input type="checkbox" id="setInterim" checked> 显示实时字幕（识别中间态）</label>
    <div class="field local-model">
      <label>浏览器内置翻译模型（可选 — Chrome 138+，下载一次后本地推理，不耗免费接口额度）</label>
      <div class="row">
        <button id="btnLocalModel">下载 / 检查</button>
        <span class="local-status" id="localModelStatus">未检查</span>
      </div>
    </div>
    <div class="modal-actions">
      <button id="btnTest">测试连接</button>
      <div class="spacer"></div>
      <button id="btnSettingsClose">取消</button>
      <button class="btn-accent" id="btnSettingsSave">保存</button>
    </div>
    <div class="test-result" id="testResult"></div>
  </div>
</div>

<script>
"use strict";

/* ================= 状态 ================= */
const state = {
  recording: false,
  segments: [],        // {ts, src, zh, lang, done}
  mode: "dual",
  fontSize: 20,
  timerStart: 0,
  timerBase: 0,
  recLang: "en-US",
};

const $ = (id) => document.getElementById(id);
const els = {
  timer: $("timer"), srcLang: $("srcLang"), micBtn: $("micBtn"),
  stateText: $("stateText"), stateHint: $("stateHint"),
  originalList: $("originalList"), zhList: $("zhList"), mixedList: $("mixedList"),
  panelOriginal: $("panelOriginal"), panelZh: $("panelZh"), panelMixed: $("panelMixed"),
  manualBox: $("manualBox"), manualInput: $("manualInput"),
  overlay: $("settingsOverlay"), langBadge: $("langBadge"),
};

/* ================= 设置 ================= */
const SETTINGS_KEY = "mmt_settings_v1";
const DEFAULTS = {
  mymemoryKey: "", glossary: "", tts: false, interim: true,
};
function loadSettings() {
  try { return {...DEFAULTS, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")}; }
  catch { return {...DEFAULTS}; }
}
function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

/* ================= 时间 ================= */
function fmtClock(sec) {
  const h = String(Math.floor(sec / 3600)).padStart(2, "0");
  const m = String(Math.floor(sec / 60) % 60).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${h}:${m}:${s}`;
}
function nowClock() {
  const sec = state.timerStart ? state.timerBase + Math.floor((Date.now() - state.timerStart) / 1000) : state.timerBase;
  return fmtClock(sec);
}
setInterval(() => { if (state.recording) els.timer.textContent = nowClock(); }, 500);

/* ================= 状态栏 ================= */
function setState(kind, text, hint) {
  els.stateText.className = "state " + (kind || "");
  els.stateText.textContent = text;
  if (hint !== undefined) els.stateHint.textContent = hint;
}

/* ================= 渲染 ================= */
function segNode(seg, kind) {
  const div = document.createElement("div");
  div.className = "seg";
  div.dataset.id = seg.id;
  const ts = document.createElement("div");
  ts.className = "seg-ts";
  ts.textContent = kind === "zh"
    ? seg.ts + " · 中文" + (seg.provider ? " · " + seg.provider : "")
    : seg.ts + (seg.lang ? " · " + seg.lang : "");
  const tx = document.createElement("div");
  tx.className = "seg-text";
  tx.textContent = kind === "zh" ? (seg.zh || "") : seg.src;
  div.appendChild(ts); div.appendChild(tx);
  return div;
}
function ensureEmpty() {
  const noSeg = state.segments.length === 0;
  for (const [list, emptyId] of [[els.originalList, "emptyOriginal"], [els.zhList, "emptyZh"]]) {
    const ex = $(emptyId);
    if (noSeg && !ex) {
      const d = document.createElement("div");
      d.className = "empty"; d.id = emptyId;
      d.innerHTML = emptyId === "emptyOriginal"
        ? '<span class="big">🎙</span>点击下方麦克风开始收音<br>发言将实时显示在这里'
        : '<span class="big">文</span>译文实时呈现<br>俄语 / 英语 → 简体中文';
      list.appendChild(d);
    } else if (!noSeg && ex) ex.remove();
  }
}
function renderAll() {
  els.originalList.querySelectorAll(".seg").forEach(n => n.remove());
  els.zhList.querySelectorAll(".seg").forEach(n => n.remove());
  els.mixedList.innerHTML = "";
  for (const seg of state.segments) {
    els.originalList.appendChild(segNode(seg, "src"));
    els.zhList.appendChild(segNode(seg, "zh"));
    if (seg.zh) {
      const zhNode = els.zhList.querySelector(`.seg[data-id="${seg.id}"] .seg-text`);
      if (zhNode) zhNode.innerHTML = '<span class="cursor"></span>';
      zhNode.textContent = seg.zh;
    }
    const m = segNode(seg, "src");
    const mz = segNode(seg, "zh");
    mz.style.marginTop = "4px";
    els.mixedList.appendChild(m); els.mixedList.appendChild(mz);
  }
  ensureEmpty();
  scrollBottom();
}
function scrollBottom() {
  for (const l of [els.originalList, els.zhList, els.mixedList]) l.scrollTop = l.scrollHeight;
}

let liveNode = null;
function showLive(text) {
  if (!loadSettings().interim) return;
  if (!liveNode) {
    liveNode = document.createElement("div");
    liveNode.className = "seg live";
    liveNode.innerHTML = '<div class="seg-ts">● 实时</div><div class="seg-text"></div>';
    els.originalList.appendChild(liveNode);
  }
  liveNode.querySelector(".seg-text").textContent = text;
  scrollBottom();
}
function hideLive() { if (liveNode) { liveNode.remove(); liveNode = null; } }

function addSegment(src, langLabel) {
  const seg = {
    id: Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    ts: nowClock(), src, zh: "", lang: langLabel, done: false,
  };
  state.segments.push(seg);
  renderAll();
  return seg;
}
function updateZh(seg) {
  const node = els.zhList.querySelector(`.seg[data-id="${seg.id}"] .seg-text`);
  if (node) node.textContent = seg.zh + (seg.done ? "" : " …");
  const mn = els.mixedList.querySelector(`.seg[data-id="${seg.id}"]`);
  if (mn) {
    const texts = els.mixedList.querySelectorAll(`.seg[data-id="${seg.id}"] .seg-text`);
    if (texts.length > 1) texts[1].textContent = seg.zh + (seg.done ? "" : " …");
  }
  scrollBottom();
}

/* ================= 免费翻译（零 key / 零 token） =================
 * 提供链：
 *   1. 浏览器内置 Translator API（本地推理，免费；浏览器支持时优先）
 *   2. MyMemory 免费接口（直连，CORS 放开）
 *   3. Google 免费接口经公共 CORS 代理（MyMemory 限流时兜底）
 * 全部免费，无需注册付费服务。
 */
const CHUNK_LIMIT = 420;

function splitChunks(text) {
  if (text.length <= CHUNK_LIMIT) return [text];
  const chunks = [];
  let rest = text;
  while (rest.length > CHUNK_LIMIT) {
    let cut = -1;
    for (const p of ["。", "！", "？", "!", "?", ".", ";", "\n", "；", "…"]) {
      const i = rest.lastIndexOf(p, CHUNK_LIMIT);
      if (i > cut) cut = i;
    }
    if (cut < CHUNK_LIMIT * 0.4) cut = CHUNK_LIMIT;
    chunks.push(rest.slice(0, cut + 1).trim());
    rest = rest.slice(cut + 1);
  }
  if (rest.trim()) chunks.push(rest.trim());
  return chunks;
}

function srcLangCode() {
  const v = els.srcLang.value;
  return v === "ru" ? "ru" : v === "en" ? "en" : "auto";
}

function fetchWithTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, {...opts, signal: ctrl.signal}).finally(() => clearTimeout(timer));
}

/* --- 通用：超时 / 等待 --- */
function withTimeout(p, ms, tag) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error((tag || "timeout") + "-timeout")), ms);
    Promise.resolve(p).then(
      (v) => { clearTimeout(t); resolve(v); },
      (e) => { clearTimeout(t); reject(e); });
  });
}
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

/* --- 提供方 1：浏览器内置翻译（Chrome 138+，本地模型，免费） ---
 * 只在模型已就绪（availability === "available"）时使用；状态是 downloadable / downloading
 * 时 create() 会触发几百 MB 的模型下载，界面看着像卡死，所以直接跳过换下一个源。 */
const localTranslatorCache = {};
async function localTranslate(chunk) {
  if (typeof Translator === "undefined") throw new Error("no-local-translator");
  const src = srcLangCode() === "auto"
    ? (/[\u0400-\u04FF]/.test(chunk) ? "ru" : "en")
    : srcLangCode();
  const key = src + ">zh";
  if (!localTranslatorCache[key]) {
    const avail = await withTimeout(
      Translator.availability({sourceLanguage: src, targetLanguage: "zh"}), 2500, "local-availability");
    if (avail !== "available") throw new Error("local-not-ready");
    localTranslatorCache[key] = await withTimeout(
      Translator.create({sourceLanguage: src, targetLanguage: "zh"}), 8000, "local-create");
  }
  return await withTimeout(localTranslatorCache[key].translate(chunk), 8000, "local-translate");
}

/* MyMemory 的译文带 HTML 实体，顺手还原 */
function decodeEntities(s) {
  return s.replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&apos;/g, "'")
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&")
    .replace(/&#(\d+);/g, (m, d) => String.fromCharCode(+d));
}

/* --- 提供方 2：MyMemory 免费接口（主力，CORS 放开，无需 key） --- */
async function mymemoryTranslate(chunk) {
  const s = loadSettings();
  const pair = (srcLangCode() === "auto" ? "Autodetect" : srcLangCode()) + "|zh-CN";
  const params = new URLSearchParams({q: chunk, langpair: pair});
  if (s.mymemoryKey) params.set("key", s.mymemoryKey);
  const url = "https://api.mymemory.translated.net/get?" + params.toString();
  for (let attempt = 0; attempt < 2; attempt++) {
    const res = await fetchWithTimeout(url, {method: "GET"}, 9000);
    if (res.status === 429) { await sleep(1200); continue; }  // 限流：歇一下再试，仍失败就换下一个源
    if (!res.ok) throw new Error("mymemory-" + res.status);
    const j = await res.json();
    const out = j && j.responseData && j.responseData.translatedText;
    if (typeof out !== "string") throw new Error("mymemory-empty");
    if (j.responseStatus && j.responseStatus !== 200 && /LIMIT/i.test(out)) {
      throw new Error("mymemory-limit");
    }
    return decodeEntities(out);
  }
  throw new Error("mymemory-429");
}

/* --- 提供方 3：Google 免费接口（公共 CORS 代理中转） --- */
const CORS_PROXIES = [
  (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  (u) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
];
function parseGtx(jsonText) {
  const j = JSON.parse(jsonText);
  if (!Array.isArray(j) || !Array.isArray(j[0])) throw new Error("gtx-parse");
  return j[0].map(seg => seg[0]).join("").trim();
}
async function gtxTranslate(chunk) {
  const sl = srcLangCode() === "auto" ? "auto" : srcLangCode();
  const target = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" +
    sl + "&tl=zh-CN&dt=t&q=" + encodeURIComponent(chunk);
  let lastErr = new Error("gtx-failed");
  for (const wrap of CORS_PROXIES) {
    try {
      const res = await fetchWithTimeout(wrap(target), {method: "GET"}, 6000);
      if (!res.ok) { lastErr = new Error("gtx-" + res.status); continue; }
      return parseGtx(await res.text());
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

const PROVIDERS = [
  {name: "浏览器内置", fn: localTranslate},
  {name: "MyMemory", fn: mymemoryTranslate},
  {name: "Google 免费", fn: gtxTranslate},
];

/* 翻译请求串行排队：MyMemory 连发会 429，排队后一次只发一条，段间留一点间隔 */
let mtChain = Promise.resolve();
function enqueueMT(fn) {
  const run = mtChain.then(fn, fn);
  mtChain = run.then(() => sleep(80), () => sleep(80));
  return run;
}
async function translateChunk(chunk, onProvider) {
  return enqueueMT(async () => {
    let lastErr = null;
    for (const p of PROVIDERS) {
      try {
        const out = await p.fn(chunk);
        if (onProvider) onProvider(p.name);
        return out;
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error("all-providers-failed");
  });
}

function applyGlossary(text) {
  const g = loadSettings().glossary.trim();
  if (!g) return text;
  let out = text;
  for (const line of g.split("\n")) {
    const i = line.indexOf("=");
    if (i <= 0) continue;
    const src = line.slice(0, i).trim();
    const dst = line.slice(i + 1).trim();
    if (!src || !dst) continue;
    out = out.split(src).join(dst);
  }
  return out;
}

function parseGlossary() {
  const g = loadSettings().glossary.trim();
  if (!g) return [];
  const pairs = [];
  for (const line of g.split("\n")) {
    const i = line.indexOf("=");
    if (i <= 0) continue;
    const src = line.slice(0, i).trim();
    const dst = line.slice(i + 1).trim();
    if (src && dst) pairs.push({src, dst});
  }
  return pairs.sort((a, b) => b.src.length - a.src.length);
}

/* 术语切分：译前把术语从原文里剥出来，译完直插目标词，
 * 避免机器翻译自作主张改写人名 / 缩写。 */
function splitAroundGlossary(text) {
  const pairs = parseGlossary();
  if (!pairs.length) return [{term: false, text}];
  const esc = pairs.map(p => p.src.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const re = new RegExp("(" + esc.join("|") + ")", "g");
  const pieces = [];
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) pieces.push({term: false, text: text.slice(last, m.index)});
    const hit = pairs.find(p => p.src === m[0]);
    pieces.push({term: true, text: m[0], dst: hit ? hit.dst : m[0]});
    last = m.index + m[0].length;
  }
  if (last < text.length) pieces.push({term: false, text: text.slice(last)});
  return pieces;
}

/* 标点不送翻译、原样保留：机器翻译经常吞掉片段开头 / 结尾的句读 */
const EDGE = /[\s.,;:!?…"'«»“”‘’()\[\]{}。，、；：！？、·—–\-]/;
async function translateFragment(text, onProvider) {
  let lead = "", tail = "", mid = text;
  while (mid.length && EDGE.test(mid[0])) { lead += mid[0]; mid = mid.slice(1); }
  while (mid.length && EDGE.test(mid[mid.length - 1])) { tail = mid[mid.length - 1] + tail; mid = mid.slice(0, -1); }
  if (!mid.trim()) return text;
  return lead + await translateChunk(mid, onProvider) + tail;
}

/* 译文标点归一：ASCII 句读夹在中文里汉化，与中文终止符重复则去重 */
function polishPunct(s) {
  return s
    .replace(/([。！？；…])[.!?;…]+/g, "$1")
    .replace(/([.!?;])[ \t]*(?=[\u4e00-\u9fff])/g, (m, p) => ({".": "。", "!": "！", "?": "？", ";": "；"}[p]))
    .replace(/,[ \t]*(?=[\u4e00-\u9fff])/g, "，")
    .replace(/([\u4e00-\u9fff])[ \t]+(?=[\u4e00-\u9fff])/g, "$1")
    .replace(/\s+([，。！？、；：])/g, "$1")
    .replace(/([。！？])\1+/g, "$1")
    .replace(/([\u4e00-\u9fff])([.!?;]+)$/g, (m, c, p) => c + ({".": "。", "!": "！", "?": "？", ";": "；"}[p[0]]));
}

async function translateText(text, onDelta, onProvider) {
  const chunks = splitChunks(text);
  let acc = "";
  for (const c of chunks) {
    const pieces = splitAroundGlossary(c);
    let part = "";
    for (const piece of pieces) {
      part += piece.term ? piece.dst : await translateFragment(piece.text, onProvider);
    }
    part = polishPunct(applyGlossary(part));
    const cjkEnd = /[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]$/.test(acc);
    const cjkStart = /^[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/.test(part);
    acc += (acc && !(cjkEnd && cjkStart) && !/\s$/.test(acc) && !/^[，。！？、；：]/.test(part) ? " " : "") + part;
    if (onDelta) onDelta(acc);
  }
  return acc;
}

async function translateSegment(seg) {
  try {
    setState("warn", "翻译中…", seg.src.slice(0, 26) + (seg.src.length > 26 ? "…" : ""));
    let used = "";
    await translateText(seg.src, (acc) => { seg.zh = acc; updateZh(seg); }, (name) => { used = name; });
    seg.provider = used;
    seg.done = true;
    if (!seg.zh) seg.zh = "（无译文）";
    updateZh(seg);
    const tsNode = els.zhList.querySelector(`.seg[data-id="${seg.id}"] .seg-ts`);
    if (tsNode && used) tsNode.textContent = seg.ts + " · 中文 · " + used;
    setState(state.recording ? "rec" : "ok", state.recording ? "聆听中" : "完成",
             (state.recording ? "麦克风收音中" : "点击麦克风继续") + (used ? " · 译文来源 " + used : ""));
    if (loadSettings().tts) speakZh(seg.zh);
  } catch (e) {
    seg.done = true;
    const msg = "翻译源暂时都连不上（" + e.message + "）：稍等再试，或在设置里填 MyMemory Key 提高额度";
    const node = els.zhList.querySelector(`.seg[data-id="${seg.id}"] .seg-text`);
    if (node) node.innerHTML = "";
    if (node) {
      const err = document.createElement("div");
      err.className = "err"; err.textContent = msg;
      node.appendChild(err);
    }
    setState("err", "出错", msg);
  }
}

function speakZh(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; u.rate = 1;
    speechSynthesis.speak(u);
  } catch { /* TTS 不可用则忽略 */ }
}

/* ================= 语音识别 ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;

function currentRecLang() {
  const v = els.srcLang.value;
  if (v === "ru") return "ru-RU";
  if (v === "en") return "en-US";
  return state.recLang; // auto：自适应
}

function newRecognizer() {
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = currentRecLang();
  r.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const res = ev.results[i];
      const text = (res[0] && res[0].transcript || "").trim();
      if (!text) continue;
      if (res.isFinal) {
        hideLive();
        // auto 模式：按文字脚本自适应切换识别语言
        if (els.srcLang.value === "auto") {
          const isCyr = /[\u0400-\u04FF]/.test(text);
          const want = isCyr ? "ru-RU" : "en-US";
          if (want !== state.recLang) {
            state.recLang = want;
            els.langBadge.textContent = isCyr ? "俄语" : "英语";
          }
        }
        const langLabel = /[\u0400-\u04FF]/.test(text) ? "俄语" : "英语";
        const seg = addSegment(text, langLabel);
        translateSegment(seg);
      } else {
        interim += text + " ";
      }
    }
    if (interim.trim()) showLive(interim.trim());
  };
  r.onerror = (ev) => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
      stopRecording(true);
      setState("err", "麦克风被拒绝", "请在浏览器地址栏允许麦克风权限后重试");
    } else if (ev.error === "network") {
      setState("err", "识别服务连不上", "Chrome 语音识别走 Google 服务器，网络需能访问 Google；也可先用「手动输入」");
    }
    // no-speech / aborted：静默，交给 onend 重启
  };
  r.onend = () => {
    if (state.recording) {
      // Chrome 长时间静音会自动结束，这里自动续上
      try {
        rec.lang = currentRecLang();
        rec.start();
      } catch { /* 已在运行则忽略 */ }
    } else {
      hideLive();
    }
  };
  return r;
}

function startRecording() {
  if (!SR) {
    setState("err", "浏览器不支持语音识别", "请使用 Chrome / Edge，或用「手动输入」");
    openManual(true);
    return;
  }
  if (!window.isSecureContext) {
    setState("err", "需要安全上下文", "麦克风要求 https 或 localhost 访问");
    return;
  }
  state.recording = true;
  state.timerStart = Date.now();
  els.timer.textContent = nowClock();
  els.micBtn.classList.add("recording");
  els.micBtn.textContent = "⏹";
  if (els.srcLang.value === "auto") {
    state.recLang = "en-US";
    els.langBadge.textContent = "自动";
  }
  rec = newRecognizer();
  try {
    rec.start();
    setState("rec", "聆听中", "麦克风收音中，发言会自动翻译");
  } catch (e) {
    setState("err", "启动失败", e.message);
    stopRecording();
  }
}

function stopRecording() {
  state.recording = false;
  state.timerBase += state.timerStart ? Math.floor((Date.now() - state.timerStart) / 1000) : 0;
  state.timerStart = 0;
  els.micBtn.classList.remove("recording");
  els.micBtn.textContent = "🎙";
  if (rec) { try { rec.onend = null; rec.stop(); } catch {} rec = null; }
  hideLive();
  setState("", "已停止", "点击麦克风继续");
}

/* ================= 手动输入 ================= */
function openManual(force) {
  const box = els.manualBox;
  if (force === true) box.classList.add("open");
  else box.classList.toggle("open");
  if (box.classList.contains("open")) els.manualInput.focus();
}
function submitManual() {
  const text = els.manualInput.value.trim();
  if (!text) return;
  els.manualInput.value = "";
  const seg = addSegment(text, /[\u0400-\u04FF]/.test(text) ? "俄语" : "英语");
  translateSegment(seg);
}

/* ================= 模式 / 字号 ================= */
function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll("#modeSeg button").forEach(b =>
    b.classList.toggle("active", b.dataset.mode === mode));
  els.panelOriginal.style.display = (mode === "dual" || mode === "orig") ? "" : "none";
  els.panelZh.style.display = (mode === "dual" || mode === "zh") ? "" : "none";
  els.panelMixed.style.display = mode === "mixed" ? "" : "none";
  if (mode === "mixed") renderAll();
}
function setFontSize(px) {
  state.fontSize = Math.max(14, Math.min(40, px));
  document.documentElement.style.setProperty("--seg-size", state.fontSize + "px");
}

/* ================= 导出 / 复制 ================= */
function fullTranscript() {
  return state.segments.map(s =>
    `[${s.ts}] ${s.lang || ""}\n${s.src}\n${s.zh}${s.done ? "" : " …"}`
  ).join("\n\n");
}
function exportTxt() {
  const head = "会议翻译纪要\n导出时间：" + new Date().toLocaleString() + "\n\n";
  const blob = new Blob([head + fullTranscript()], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "会议纪要-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-") + ".txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ================= 设置弹窗 ================= */
function openSettings() {
  const s = loadSettings();
  $("setKey").value = s.mymemoryKey;
  $("setGlossary").value = s.glossary;
  $("setTts").checked = s.tts;
  $("setInterim").checked = s.interim;
  $("testResult").textContent = "";
  setLocalStatus(Object.keys(localTranslatorCache).length ? "已就绪（本次会话）" : "未检查");
  els.overlay.classList.add("open");
}
function closeSettings() { els.overlay.classList.remove("open"); }
function collectSettings() {
  return {
    mymemoryKey: $("setKey").value.trim(),
    glossary: $("setGlossary").value,
    tts: $("setTts").checked,
    interim: $("setInterim").checked,
  };
}
/* 浏览器内置翻译模型：Chrome 要求下载必须由用户手势触发，
 * 所以只能在设置里点按钮；下好之后 localTranslate 会自动优先用它。 */
function setLocalStatus(text, cls) {
  const n = $("localModelStatus");
  if (!n) return;
  n.textContent = text;
  n.className = "local-status" + (cls ? " " + cls : "");
}
async function enableLocalModel() {
  if (typeof Translator === "undefined") {
    setLocalStatus("当前浏览器不支持，继续用 MyMemory", "err");
    return;
  }
  setLocalStatus("检查中…");
  try {
    for (const [from, label] of [["en", "英"], ["ru", "俄"]]) {
      const avail = await Translator.availability({sourceLanguage: from, targetLanguage: "zh"});
      if (avail === "available") { setLocalStatus(label + "→中 已就绪"); continue; }
      if (avail === "unavailable") { setLocalStatus(label + "→中 该语言对不支持"); continue; }
      setLocalStatus(label + "→中 下载中…（首次可能几分钟）");
      let pct = "";
      const t = await Translator.create({
        sourceLanguage: from, targetLanguage: "zh",
        monitor(m) {
          m.addEventListener("downloadprogress", (e) => {
            pct = Math.round((e.loaded || 0) * 100) + "%";
            setLocalStatus(label + "→中 下载中 " + pct);
          });
        },
      });
      localTranslatorCache[from + ">zh"] = t;
      setLocalStatus(label + "→中 下载完成");
    }
    setLocalStatus("本地模型就绪，翻译不再走网络", "ok");
  } catch (e) {
    setLocalStatus("下载失败（" + e.message.slice(0, 40) + "），仍用 MyMemory", "err");
  }
}

async function testConnection() {
  const tr = $("testResult");
  tr.className = "test-result";
  tr.textContent = "测试中…";
  saveSettings(collectSettings());
  try {
    let used = "";
    const out = await translateText("hello, welcome to the meeting", null, (p) => used = p);
    tr.className = "test-result ok";
    tr.textContent = "连接成功 ✓  来源：" + used + "  译文：" + out.slice(0, 30);
  } catch (e) {
    tr.className = "test-result err";
    tr.textContent = "连接失败：" + e.message;
  }
}

/* ================= 事件绑定 ================= */
els.micBtn.addEventListener("click", () => state.recording ? stopRecording() : startRecording());
$("btnSettings").addEventListener("click", openSettings);
$("btnSettingsClose").addEventListener("click", closeSettings);
$("btnSettingsSave").addEventListener("click", () => {
  saveSettings(collectSettings());
  closeSettings();
  setState("", "设置已保存", "配置保存在本机浏览器");
});
$("btnTest").addEventListener("click", testConnection);
$("btnLocalModel").addEventListener("click", enableLocalModel);
els.overlay.addEventListener("click", (e) => { if (e.target === els.overlay) closeSettings(); });
$("btnFullscreen").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});
document.querySelectorAll("#modeSeg button").forEach(b =>
  b.addEventListener("click", () => setMode(b.dataset.mode)));
$("fontMinus").addEventListener("click", () => setFontSize(state.fontSize - 2));
$("fontPlus").addEventListener("click", () => setFontSize(state.fontSize + 2));
$("btnManual").addEventListener("click", () => openManual());
$("manualTranslate").addEventListener("click", submitManual);
els.manualInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitManual(); }
});
$("btnCopy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(fullTranscript()); setState("ok", "已复制", "全文已进剪贴板"); }
  catch { setState("err", "复制失败", "浏览器拒绝了剪贴板权限"); }
});
$("btnExport").addEventListener("click", exportTxt);
$("btnClear").addEventListener("click", () => {
  if (!state.segments.length) return;
  if (confirm("清空当前全部记录？")) {
    state.segments = [];
    state.timerBase = 0; state.timerStart = state.recording ? Date.now() : 0;
    els.timer.textContent = "00:00:00";
    renderAll();
  }
});
window.addEventListener("beforeunload", (e) => {
  if (state.recording) { e.preventDefault(); e.returnValue = ""; }
});

/* ================= 启动 ================= */
setFontSize(20);
setMode("dual");
if (!SR) {
  setState("warn", "语音识别不可用", "当前浏览器不支持，可用「手动输入」或换 Chrome / Edge");
} else {
  setState("", "就绪", "选择语言后点击麦克风开始");
}
</script>
